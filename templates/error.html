<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Menstrual Health Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #6c757d;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: bold;
            border-radius: 15px 15px 0 0 !important;
        }
        .btn-primary {
            background-color: #d63384;
            border-color: #d63384;
        }
        .btn-primary:hover {
            background-color: #ab296a;
            border-color: #ab296a;
        }
        .error-icon {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 Menstrual Health Prediction Tool</h1>
            <p class="lead">Error Occurred</p>
        </div>

        <div class="card">
            <div class="card-header">
                Error
            </div>
            <div class="card-body text-center">
                <div class="error-icon">⚠️</div>
                <h4 class="text-danger">Something went wrong!</h4>
                <p class="mb-4">{{ error }}</p>
                
                <div class="alert alert-info" role="alert">
                    <p>
                        <strong>Possible solutions:</strong>
                    </p>
                    <ul class="text-start">
                        <li>Check that all input values are within the specified ranges</li>
                        <li>Ensure date formats are correct (YYYY-MM-DD)</li>
                        <li>Try refreshing the page and submitting again</li>
                    </ul>
                </div>
                
                <a href="/" class="btn btn-primary mt-3">Go Back Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
